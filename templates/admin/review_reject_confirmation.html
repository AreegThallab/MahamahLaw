{% extends "admin/base_site.html" %}
{% block content %}
<p>هل تؤكد رفض التقييمات التالية؟ لن تظهر في الموقع العام بعد الرفض.</p>
<ul>{% for item in queryset %}<li>{{ item.name }} — {{ item.rating }} من 5</li>{% endfor %}</ul>
<form method="post">{% csrf_token %}
    {% for item in queryset %}<input type="hidden" name="{{ action_checkbox_name }}" value="{{ item.pk }}">{% endfor %}
    <input type="hidden" name="action" value="reject">
    <button type="submit" name="confirm_reject" value="yes">تأكيد الرفض</button>
    <a href="{% url 'admin:core_review_changelist' %}">إلغاء</a>
</form>
{% endblock %}
