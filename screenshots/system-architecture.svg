<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">MAHAMAH system architecture</title>
  <desc id="desc">Public submissions pass through Django Forms to the core application. Authorized staff use the dashboard. Both access SQLite through the Django ORM. Approved reviews appear on the public website.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f4ede3"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#ad804a"/></marker>
    <style>
      text{font-family:Arial,sans-serif;text-anchor:middle;fill:#10212d}.label{font-size:17px;font-weight:700}.caption{font-size:13px;fill:#687484}.box{fill:white;stroke:#dfd5c5;stroke-width:1.5}.link{fill:none;stroke:#ad804a;stroke-width:2;marker-end:url(#arrow)}.navy{fill:#10212d}.white{fill:#fffefa}
    </style>
  </defs>
  <rect width="1120" height="700" rx="20" fill="url(#paper)"/>
  <text x="560" y="40" class="label" style="font-size:22px">MAHAMAH · System Architecture</text>
  <text x="560" y="65" class="caption">Server-rendered pages · Shared records · Permission-checked administration</text>
  <rect x="50" y="92" width="420" height="376" rx="18" fill="#fffefa" stroke="#e7dfd3"/>
  <rect x="650" y="92" width="420" height="376" rx="18" fill="#fffefa" stroke="#e7dfd3"/>
  <text x="260" y="122" class="caption">PUBLIC EXPERIENCE</text>
  <text x="860" y="122" class="caption">ADMINISTRATION</text>
  <rect x="105" y="142" width="310" height="66" rx="10" class="box"/>
  <text x="260" y="171" class="label">Website Visitor</text><text x="260" y="191" class="caption">Services · Consultations · Reviews</text>
  <rect x="105" y="246" width="310" height="66" rx="10" class="box"/>
  <text x="260" y="274" class="label">Public Website</text><text x="260" y="295" class="caption">Django Templates · HTML / CSS / JavaScript</text>
  <rect x="105" y="350" width="310" height="82" rx="10" class="box"/>
  <text x="260" y="380" class="label">Forms &amp; Core Application</text><text x="260" y="402" class="caption">Validation · CSRF · Submission safeguards</text>
  <path class="link" d="M260 208V242"/><path class="link" d="M260 312V346"/>
  <rect x="705" y="142" width="310" height="66" rx="10" class="box"/>
  <text x="860" y="171" class="label">Authorized Staff</text><text x="860" y="191" class="caption">Active administrative accounts</text>
  <rect x="705" y="246" width="310" height="66" rx="10" class="box"/>
  <text x="860" y="274" class="label">Authentication &amp; Permissions</text><text x="860" y="295" class="caption">Django authentication · Model permissions</text>
  <rect x="705" y="350" width="310" height="82" rx="10" class="box"/>
  <text x="860" y="380" class="label">Administration Dashboard</text><text x="860" y="402" class="caption">Requests · Moderation · Reports · Live updates</text>
  <path class="link" d="M860 208V242"/><path class="link" d="M860 312V346"/>
  <path class="link" d="M415 391H465V514H485"/><path class="link" d="M705 391H655V514H635"/>
  <rect x="445" y="490" width="230" height="55" rx="11" class="navy"/>
  <text x="560" y="525" class="label white">Django ORM</text>
  <path class="link" d="M560 545V582"/>
  <rect x="445" y="586" width="230" height="66" rx="12" class="box"/>
  <text x="560" y="614" class="label">SQLite Database</text><text x="560" y="635" class="caption">Users · Requests · Reviews</text>
  <path class="link" stroke-dasharray="6 5" d="M445 619H74V279H101"/>
  <rect x="105" y="587" width="290" height="38" rx="8" fill="#f4ede3"/>
  <text x="250" y="611" class="caption">Approved reviews appear on the website</text>
  <text x="860" y="518" class="caption">15-second polling refreshes dashboard lists</text>
  <text x="560" y="680" class="caption">MAHAMAH · One Django application, one source of stored records</text>
</svg>
